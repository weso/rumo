[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyrumo"
description = "Run nemo rules over pandas/Polars DataFrames and RDF data from Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["polars>=1.0"]
keywords = ["polars", "dataframe", "RDF", "Turtle", "Semantic Web", "nemo"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest>=8", "pandas"]

[tool.maturin]
features = ["python"]
module-name = "pyrumo"
# The crate also defines the `rumo` CLI binary; only the extension module goes in the wheel.
bindings = "pyo3"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
